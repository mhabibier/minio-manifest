# Services for MinIO
#
# 1. Headless Service — digunakan oleh StatefulSet untuk DNS discovery
# 2. ClusterIP Service — untuk akses S3 API dari dalam cluster (book-service)
# 3. NodePort Service — untuk akses MinIO Console dari luar cluster (admin UI)

# ── 1. Headless Service (untuk StatefulSet DNS) ───────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: minio-headless
  namespace: minio
  labels:
    app.kubernetes.io/name:      minio
    app.kubernetes.io/component: headless-service
spec:
  clusterIP: None   # Headless — tidak ada VIP, langsung ke pod IP
  selector:
    app: minio
  ports:
    - name:       s3-api
      port:       9000
      targetPort: s3-api
      protocol:   TCP

---

# ── 2. ClusterIP Service — S3 API (digunakan book-service via DNS) ────────────
# book-service mengakses MinIO dengan:
#   S3_ENDPOINT: http://minio.minio.svc.cluster.local:9000
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: minio
  labels:
    app.kubernetes.io/name:      minio
    app.kubernetes.io/component: s3-api-service
spec:
  type: ClusterIP
  selector:
    app: minio
  ports:
    - name:       s3-api
      port:       9000
      targetPort: s3-api
      protocol:   TCP

---

# ── 3. NodePort Service — MinIO Console (akses admin dari luar cluster) ───────
# Akses MinIO Web Console: http://<node-ip>:30901
apiVersion: v1
kind: Service
metadata:
  name: minio-console-np
  namespace: minio
  labels:
    app.kubernetes.io/name:      minio
    app.kubernetes.io/component: console-nodeport
spec:
  type: NodePort
  selector:
    app: minio
  ports:
    - name:       console
      port:       9001
      targetPort: console
      protocol:   TCP
      nodePort:   30901   # Akses MinIO Console: http://<node-ip>:30901
