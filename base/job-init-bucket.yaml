# Job to initialize MinIO bucket after the server is running.

apiVersion: batch/v1
kind: Job
metadata:
  name: minio-init-bucket
  namespace: minio
  labels:
    app.kubernetes.io/name:      minio
    app.kubernetes.io/component: init-bucket
spec:
  backoffLimit: 5
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app: minio-init
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser:    1000
        runAsGroup:   1000
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: harbor-secret
      containers:
        - name: mc
          image: quay.io/minio/mc:latest
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem:   false
            runAsNonRoot:             true
            runAsUser:                1000
            capabilities:
              drop: ["ALL"]
          command:
            - sh
            - -c
            - |
              MINIO_SVC="http://minio.minio.svc.cluster.local:9000"
              MINIO_POD="http://minio-0.minio-headless.minio.svc.cluster.local:9000"
              MAX_RETRIES=30
              RETRY_INTERVAL=5
              COUNT=0

              echo "=============================="
              echo "[debug] DNS config:"
              cat /etc/resolv.conf
              echo "=============================="

              echo "[debug] Testing Service DNS: $MINIO_SVC"
              wget -q -T 5 -O /dev/null "$MINIO_SVC/minio/health/live" 2>&1 && echo "[debug] Service DNS: OK" || echo "[debug] Service DNS: FAILED"

              echo "[debug] Testing Pod DNS: $MINIO_POD"
              wget -q -T 5 -O /dev/null "$MINIO_POD/minio/health/live" 2>&1 && echo "[debug] Pod DNS: OK" || echo "[debug] Pod DNS: FAILED"
              echo "=============================="

              # Determine which endpoint works
              ENDPOINT=""
              if wget -q -T 5 -O /dev/null "$MINIO_SVC/minio/health/live" 2>/dev/null; then
                ENDPOINT="$MINIO_SVC"
                echo "[minio-init] Using Service DNS endpoint"
              elif wget -q -T 5 -O /dev/null "$MINIO_POD/minio/health/live" 2>/dev/null; then
                ENDPOINT="$MINIO_POD"
                echo "[minio-init] Using Pod DNS endpoint"
              fi

              # If neither works, wait and retry
              if [ -z "$ENDPOINT" ]; then
                echo "[minio-init] Neither endpoint reachable. Entering retry loop..."
                until wget -q -T 5 -O /dev/null "$MINIO_SVC/minio/health/live" 2>/dev/null || \
                      wget -q -T 5 -O /dev/null "$MINIO_POD/minio/health/live" 2>/dev/null; do
                  COUNT=$((COUNT + 1))
                  if [ "$COUNT" -ge "$MAX_RETRIES" ]; then
                    echo "[minio-init] ERROR: MinIO not reachable after $MAX_RETRIES attempts."
                    echo "[minio-init] Last wget attempt (full output):"
                    wget -O /dev/null "$MINIO_SVC/minio/health/live" 2>&1 || true
                    exit 1
                  fi
                  echo "[minio-init] Attempt $COUNT/$MAX_RETRIES - retrying in ${RETRY_INTERVAL}s..."
                  sleep "$RETRY_INTERVAL"
                done

                # Re-determine which works
                if wget -q -T 5 -O /dev/null "$MINIO_SVC/minio/health/live" 2>/dev/null; then
                  ENDPOINT="$MINIO_SVC"
                else
                  ENDPOINT="$MINIO_POD"
                fi
              fi

              echo "[minio-init] MinIO is healthy at: $ENDPOINT"

              echo "[minio-init] Configuring mc alias..."
              mc alias set local "$ENDPOINT" "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"

              echo "[minio-init] Creating bucket 'books'..."
              mc mb --ignore-existing local/books

              echo "[minio-init] Setting public read access on bucket 'books'..."
              mc anonymous set public local/books

              echo "[minio-init] Done. Bucket 'books' is ready."
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: minio-secret
                  key:  MINIO_ROOT_USER
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: minio-secret
                  key:  MINIO_ROOT_PASSWORD
          resources:
            requests:
              cpu:    "50m"
              memory: "64Mi"
            limits:
              cpu:    "200m"
              memory: "256Mi"
