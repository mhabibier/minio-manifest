# Job to initialize MinIO bucket after the server is running.

apiVersion: batch/v1
kind: Job
metadata:
  name: minio-init-bucket
  namespace: minio
  labels:
    app.kubernetes.io/name:      minio
    app.kubernetes.io/component: init-bucket
spec:
  backoffLimit: 5
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app: minio-init
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser:    1000
        runAsGroup:   1000
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: harbor-secret
      containers:
        - name: mc
          image: quay.io/minio/mc:latest
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem:   false
            runAsNonRoot:             true
            runAsUser:                1000
            capabilities:
              drop: ["ALL"]
          command:
            - sh
            - -c
            - |
              MAX_RETRIES=30
              RETRY_INTERVAL=5
              COUNT=0

              echo "[minio-init] Waiting for MinIO to be ready..."
              echo "[minio-init] Trying to set mc alias..."

              until mc alias set local http://minio.minio.svc.cluster.local:9000 \
                "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"; do
                COUNT=$((COUNT + 1))
                if [ "$COUNT" -ge "$MAX_RETRIES" ]; then
                  echo "[minio-init] ERROR: Could not connect after $MAX_RETRIES attempts."
                  exit 1
                fi
                echo "[minio-init] Attempt $COUNT/$MAX_RETRIES failed, retrying in ${RETRY_INTERVAL}s..."
                sleep "$RETRY_INTERVAL"
              done

              echo "[minio-init] Connected to MinIO!"

              echo "[minio-init] Creating bucket 'books'..."
              mc mb --ignore-existing local/books

              echo "[minio-init] Setting public read access on bucket 'books'..."
              mc anonymous set public local/books

              echo "[minio-init] Setting CORS policy on bucket 'books'..."
              # CORS diperlukan agar browser di app.sxdentrypoint.my.id bisa load
              # gambar dari s3-api.sxdentrypoint.my.id (cross-origin image request)
              printf '%s' '{"CORSRules":[{"AllowedOrigins":["https://app.sxdentrypoint.my.id","https://dash.sxdentrypoint.my.id"],"AllowedMethods":["GET","HEAD"],"AllowedHeaders":["*"],"ExposeHeaders":["ETag","Content-Length","Content-Type"],"MaxAgeSeconds":86400}]}' > /tmp/cors.json
              mc cors set local/books /tmp/cors.json || \
                echo "[minio-init] WARN: mc cors set failed (older mc version), skipping CORS config"

              echo "[minio-init] Done. Bucket 'books' is ready."
          env:
            - name: MC_CONFIG_DIR
              value: /tmp/.mc
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: minio-secret
                  key:  MINIO_ROOT_USER
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: minio-secret
                  key:  MINIO_ROOT_PASSWORD
          resources:
            requests:
              cpu:    "50m"
              memory: "64Mi"
            limits:
              cpu:    "200m"
              memory: "256Mi"
