# Secret for MinIO
# Berisi credentials root MinIO (setara MINIO_ROOT_USER & MINIO_ROOT_PASSWORD di Docker Compose).
#
# Cara encode base64:
#   echo -n 'minioadmin' | base64
#
# Ganti nilai di bawah dengan credentials yang aman sebelum deploy ke production.

apiVersion: v1
kind: Secret
metadata:
  name: minio-secret
  namespace: minio
  labels:
    app.kubernetes.io/name:      minio
    app.kubernetes.io/component: secret
type: Opaque
data:
  # echo -n 'minioadmin' | base64  → bWluaW9hZG1pbg==
  MINIO_ROOT_USER:     bWluaW9hZG1pbg==
  # echo -n 'minioadmin' | base64  → bWluaW9hZG1pbg==
  MINIO_ROOT_PASSWORD: bWluaW9hZG1pbg==
