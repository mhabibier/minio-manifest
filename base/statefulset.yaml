# StatefulSet for MinIO

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: minio
  namespace: minio
  labels:
    app.kubernetes.io/name:      minio
    app.kubernetes.io/component: object-storage
    app.kubernetes.io/version:   "latest"
spec:
  serviceName: minio-headless
  replicas: 1
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
        app.kubernetes.io/name:      minio
        app.kubernetes.io/component: object-storage
    spec:
      serviceAccountName: minio-sa
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser:    1000
        runAsGroup:   1000
        fsGroup:      1000
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      imagePullSecrets:
        - name: harbor-secret
      initContainers:
        - name: fix-permissions
          image: quay.io/minio/minio:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser:  0
            runAsGroup: 0
            runAsNonRoot: false
          command:
            - sh
            - -c
            - |
              echo "==> Fixing ownership on data directory..."
              chown -R 1000:1000 /data
              echo "==> Permissions fixed."
          volumeMounts:
            - name:      minio-data
              mountPath: /data
      containers:
        - name: minio
          image: quay.io/minio/minio:latest
          imagePullPolicy: IfNotPresent
          args:
            - server
            - /data
            - --console-address
            - ":9001"
          ports:
            - name:          s3-api
              containerPort: 9000
              protocol:      TCP
            - name:          console
              containerPort: 9001
              protocol:      TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem:   false
            runAsNonRoot:             true
            runAsUser:                1000
            capabilities:
              drop: ["ALL"]
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: minio-secret
                  key:  MINIO_ROOT_USER
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: minio-secret
                  key:  MINIO_ROOT_PASSWORD
            # CORS server-level config — izinkan browser load gambar dari domain frontend
            # (mc cors set tidak didukung versi MinIO ini, pakai env var sebagai pengganti)
            - name: MINIO_API_CORS_ALLOW_ORIGIN
              value: "https://app.sxdentrypoint.my.id,https://dash.sxdentrypoint.my.id"
          startupProbe:
            httpGet:
              path: /minio/health/live
              port: s3-api
            initialDelaySeconds: 10
            periodSeconds:       5
            failureThreshold:    12
            timeoutSeconds:      3
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: s3-api
            initialDelaySeconds: 0
            periodSeconds:       30
            timeoutSeconds:      5
            failureThreshold:    3
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: s3-api
            initialDelaySeconds: 0
            periodSeconds:       10
            timeoutSeconds:      3
            failureThreshold:    3
            successThreshold:    1
          resources:
            requests:
              cpu:    "100m"
              memory: "256Mi"
            limits:
              cpu:    "1000m"
              memory: "1Gi"
          volumeMounts:
            - name:      minio-data
              mountPath: /data
            - name:      tmp
              mountPath: /tmp
      volumes:
        - name: minio-data
          persistentVolumeClaim:
            claimName: minio-data-pvc
        - name: tmp
          emptyDir: {}
